        function onDataSourceSelect() {
            const select = document.getElementById('task-datasource');
            const statusEl = document.getElementById('datasource-status');
            const infoEl = document.getElementById('datasource-info');
            const detailsEl = document.getElementById('datasource-details');
            
            if (!select.value) {
                statusEl.innerHTML = '<span style="color: var(--gray-500);">未选择</span>';
                infoEl.style.display = 'none';
                return;
            }
            
            const option = select.selectedOptions[0];
            const config = JSON.parse(option.dataset.config);
            
            // 显示数据源信息
            statusEl.innerHTML = '<span style="color: var(--success);">● 已选择</span>';
            infoEl.style.display = 'block';
            detailsEl.innerHTML = `
                <div>类型: ${config.db_type || 'mysql'}</div>
                <div>主机: ${config.host}</div>
                <div>端口: ${config.port}</div>
                <div>数据库: ${config.database || '-'}</div>
                <div>用户: ${config.username}</div>
            `;
        }
        
        function previewSqlParams() {
            let sql = document.getElementById('task-sql').value;
            const params = JSON.parse(localStorage.getItem('sql_params') || '[]');
            
            if (!sql) {
                alert('请输入SQL语句');
                return;
            }
            
            // 替换参数
            params.forEach(p => {
                const regex = new RegExp('\\$\\{' + p.name + '\\}', 'g');
                sql = sql.replace(regex, p.value || '[' + p.name + ']');
            });
            
            alert('参数替换后的SQL:\n\n' + sql);
        }
        
        function testSqlQuery() {
            const datasource = document.getElementById('task-datasource');
            let sql = document.getElementById('task-sql').value;
            
            if (!datasource.value) {
                alert('请先选择数据源');
                return;
            }
            if (!sql) {
                alert('请输入SQL语句');
                return;
            }
            
            // 替换参数
            const params = JSON.parse(localStorage.getItem('sql_params') || '[]');
            params.forEach(p => {
                const regex = new RegExp('\\$\\{' + p.name + '\\}', 'g');
                sql = sql.replace(regex, p.value || '');
            });
            
            const config = JSON.parse(datasource.selectedOptions[0].dataset.config);
            
            // 调用后端执行SQL
            fetch('/api/sql/execute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    ...config,
                    sql
                })
            }).then(r => r.json()).then(d => {
                if (d.success) {
                    alert('查询成功！\n返回 ' + (d.data?.length || 0) + ' 条记录');
                } else {
                    alert('查询失败: ' + d.error);
                }
            }).catch(e => {
                alert('请求失败: ' + e.message);
            });
        }
        
        function applyCronPreset() {
            const preset = document.getElementById('cron-preset');
            const cron = preset.value;
            const desc = preset.selectedOptions[0]?.dataset?.desc || '';
            
            if (cron) {
                document.getElementById('task-cron').value = cron;
                document.getElementById('cron-desc').textContent = desc;
            }
        }
        
        function updateCronDesc() {
            const cron = document.getElementById('task-cron').value;
            const desc = parseCronDescription(cron);
            document.getElementById('cron-desc').textContent = desc;
        }
        
        function parseCronDescription(cron) {
            if (!cron) return '';
            const parts = cron.split(' ');
            if (parts.length !== 6) return '格式不正确';
            
            const [sec, min, hour, day, month, week] = parts;
            let desc = '';
            
            if (week !== '?' && week !== '*') {
                const weekNames = { 'MON': '周一', 'TUE': '周二', 'WED': '周三', 'THU': '周四', 'FRI': '周五', 'SAT': '周六', 'SUN': '周日' };
                desc += `每${weekNames[week] || week}`;
            } else if (day !== '*' && day !== '?') {
                desc += `每月${day}号`;
            } else {
                desc = '每天';
            }
            
            if (hour !== '*' && hour !== '?') {
                desc += ` ${hour}点`;
            }
            if (min !== '*' && min !== '?') {
                desc += `${min}分`;
            }
            
            return desc + '执行';
        }
        
        function testCronExpression() {
            const cron = document.getElementById('task-cron').value;
            if (!cron) {
                alert('请输入Cron表达式');
                return;
            }
            
            fetch('/api/cron/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cron })
            }).then(r => r.json()).then(d => {
                if (d.success) {
                    alert(`表达式有效！\n下次执行时间: ${d.next_run}\n描述: ${d.description}`);
                } else {
                    alert('表达式无效: ' + d.error);
                }
            }).catch(() => {
                alert('表达式解析: ' + parseCronDescription(cron));
            });
        }
        
        function saveTask() {
            const name = document.getElementById('task-name').value;
            const cron = document.getElementById('task-cron').value;
            const datasource = document.getElementById('task-datasource');
            const sql = document.getElementById('task-sql')?.value || '';
            
            // 从钉钉推送配置获取webhook
            const pushConfig = JSON.parse(localStorage.getItem('dingtalk_push_config') || '{}');
            
            if (!name || !cron) {
                alert('请填写任务名称和Cron表达式');
                return;
            }
            if (!datasource.value) {
                alert('请选择数据源');
                return;
            }
            if (!pushConfig.webhook) {
                alert('请先在"钉钉推送"中配置Webhook地址');
                return;
            }
            
            const datasourceConfig = JSON.parse(datasource.selectedOptions[0].dataset.config);
            
            const task = {
                id: Date.now(),
                name,
                cron,
                cronDesc: parseCronDescription(cron),
                datasource: datasource.value,
                datasourceConfig,
                sql,
                webhook: pushConfig.webhook,
                secret: pushConfig.secret,
                status: 'active',
                createTime: new Date().toLocaleString('zh-CN'),
                nextRun: calculateNextRun(cron)
            };
            
            const tasks = JSON.parse(localStorage.getItem('scheduled_tasks') || '[]');
            tasks.push(task);
            localStorage.setItem('scheduled_tasks', JSON.stringify(tasks));
            
            // 调用后端创建定时任务
            fetch('/api/task/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(task)
            }).then(r => r.json()).then(d => {
                if (d.success) {
                    alert('定时任务创建成功！');
                    selectComponent('task-list');
                } else {
                    alert('创建失败: ' + d.error);
                }
            }).catch(() => {
                alert('任务已保存到本地！');
                selectComponent('task-list');
            });
        }
        
        function calculateNextRun(cron) {
            // 简单计算下次运行时间
            const parts = cron.split(' ');
            if (parts.length !== 6) return '-';
            
            const [sec, min, hour, day, month, week] = parts;
            let next = new Date();
            
            // 简化处理：根据表达式计算下次执行时间
            if (week !== '?') {
                const weekNum = { 'MON': 1, 'TUE': 2, 'WED': 3, 'THU': 4, 'FRI': 5, 'SAT': 6, 'SUN': 0 };
                const targetDay = weekNum[week] || 0;
                const currentDay = next.getDay();
                let daysUntil = (targetDay - currentDay + 7) % 7;
                if (daysUntil === 0 && next.getHours() >= parseInt(hour)) {
                    daysUntil = 7;
                }
                next.setDate(next.getDate() + daysUntil);
            }
            
            next.setHours(parseInt(hour) || 0);
            next.setMinutes(parseInt(min) || 0);
            next.setSeconds(parseInt(sec) || 0);
            
            return next.toLocaleString('zh-CN');
        }
        
        function pauseTask(index) {
            const tasks = JSON.parse(localStorage.getItem('scheduled_tasks') || '[]');
            tasks[index].status = 'paused';
            localStorage.setItem('scheduled_tasks', JSON.stringify(tasks));
            
            fetch('/api/task/pause', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task_id: tasks[index].id })
            }).catch(() => {});
            
            updateConfigPanel();
        }
        
        function resumeTask(index) {
            const tasks = JSON.parse(localStorage.getItem('scheduled_tasks') || '[]');
            tasks[index].status = 'active';
            tasks[index].nextRun = calculateNextRun(tasks[index].cron);
            localStorage.setItem('scheduled_tasks', JSON.stringify(tasks));
            
            fetch('/api/task/resume', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task_id: tasks[index].id })
            }).catch(() => {});
            
            updateConfigPanel();
        }
        
        function editTask(index) {
            const tasks = JSON.parse(localStorage.getItem('scheduled_tasks') || '[]');
            const task = tasks[index];
            
            selectComponent('task-config');
            setTimeout(() => {
                document.getElementById('task-name').value = task.name;
                document.getElementById('task-cron').value = task.cron;
                document.getElementById('task-type').value = task.type;
                if (document.getElementById('task-sql')) document.getElementById('task-sql').value = task.sql || '';
                document.getElementById('task-webhook').value = task.webhook;
                if (document.getElementById('task-secret')) document.getElementById('task-secret').value = task.secret || '';
            }, 100);
        }
        
        function deleteTask(index) {
            if (!confirm('确定要删除这个任务吗？')) return;
            
            const tasks = JSON.parse(localStorage.getItem('scheduled_tasks') || '[]');
            const taskId = tasks[index].id;
            tasks.splice(index, 1);
            localStorage.setItem('scheduled_tasks', JSON.stringify(tasks));
            
            fetch('/api/task/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task_id: taskId })
            }).catch(() => {});
            
            updateConfigPanel();
        }
        
        function refreshTaskList() {
            updateConfigPanel();
        }
        
        function toggleTaskType() {
            const type = document.getElementById('task-type').value;
            const sqlSection = document.getElementById('sql-config-section');
            if (sqlSection) {
                sqlSection.style.display = type === 'sql_push' ? '' : 'none';
            }
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            updateConfigPanel();
            renderSqlHistory();
        });
    </script>
