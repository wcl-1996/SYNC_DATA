        function connectTarget() {
            fetch('/api/connect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(getTargetConfig())
            }).then(r => r.json()).then(d => {
                if (d.success) {
                    targetConnected = true;
                    populateDropdown('target-db', d.databases);
                    loadTargetTables();
                    updateConfigPanel();
                } else {
                    alert('连接失败: ' + d.error);
                }
            });
        }

        function loadSourceTables() {
            fetch('/api/get_tables', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(getSourceConfig())
            }).then(r => r.json()).then(d => {
                if (d.success) {
                    sourceTables = d.tables;
                    populateDropdown('source-table', d.tables);
                }
            });
        }

        function loadTargetTables() {
            fetch('/api/get_tables', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(getTargetConfig())
            }).then(r => r.json()).then(d => {
                if (d.success) {
                    targetTables = d.tables;
                    populateDropdown('target-table', d.tables);
                }
            });
        }

        function loadSourceColumns() {
            const table = document.getElementById('source-table')?.value;
            if (!table) return;
            fetch('/api/get_schema', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...getSourceConfig(), table })
            }).then(r => r.json()).then(d => {
                if (d.success) {
                    sourceSchema = d.schema;
                    const timeFieldEl = document.getElementById('source-time-field');
                    if (timeFieldEl) {
                        populateDropdown('source-time-field', d.schema.map(c => c.field));
                    }
                }
            });
        }

        function loadTargetColumns() {
            const table = document.getElementById('target-table')?.value;
            if (!table) return;
            fetch('/api/get_schema', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...getTargetConfig(), table })
            }).then(r => r.json()).then(d => {
                if (d.success) {
                    targetSchema = d.schema;
                    populateDropdown('delete-field', d.schema.map(c => c.field));
                    populateDropdown('partition-field', d.schema.map(c => c.field));
                }
            });
        }

        function filterSourceTables() {
            const search = document.getElementById('source-table-search')?.value.toLowerCase() || '';
            const filtered = sourceTables.filter(t => t.toLowerCase().includes(search));
            populateDropdown('source-table', filtered);
        }

        function filterTargetTables() {
            const search = document.getElementById('target-table-search')?.value.toLowerCase() || '';
            const filtered = targetTables.filter(t => t.toLowerCase().includes(search));
            populateDropdown('target-table', filtered);
        }

        function populateDropdown(id, items) {
            const dropdown = document.getElementById(id);
            if (!dropdown) return;
            dropdown.innerHTML = `<option value="">请选择...</option>` + items.map(i => `<option value="${i}">${i}</option>`).join('');
        }

        // ==================== 字段映射 ====================
        function autoMapColumns() {
            const sourceTable = document.getElementById('source-table')?.value;
            const targetTable = document.getElementById('target-table')?.value;
            
            if (!sourceTable || !targetTable) {
                alert('请先选择源表和目标表');
                return;
            }
            if (!sourceSchema.length || !targetSchema.length) {
                alert('请先加载表结构');
                return;
            }
            
            const tbody = document.getElementById('column-mapping-body');
            if (!tbody) return;
            tbody.innerHTML = '';
            
            sourceSchema.forEach(src => {
                const tgt = targetSchema.find(c => c.field.toLowerCase() === src.field.toLowerCase());
                const selectedValue = tgt?.field || '';
                const options = targetSchema.map(c => 
                    `<option value="${c.field}" ${c.field === selectedValue ? 'selected' : ''}>${c.field}</option>`
                ).join('');
                tbody.innerHTML += `<tr draggable="true" ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="drop(event)">
                    <td style="cursor: move;"><svg width="16" height="16" viewBox="0 0 24 24" fill="var(--gray-400)"><path d="M11 5h2v2h-2zm0 4h2v2h-2zm0 4h2v2h-2zm0 4h2v2h-2z"/></svg></td>
                    <td><input class="form-input" value="${src.field}" readonly style="background: var(--gray-50);"></td>
                    <td><select class="form-select"><option value="">选择字段</option>${options}</select></td>
                    <td><input class="form-input" value="${src.type}"></td>
                    <td><input class="form-input" value="${src.default || ''}"></td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteColumnRow(this)">删除</button></td>
                </tr>`;
            });
        }

        function addEmptyColumnMapping() {
            const options = targetSchema.map(c => `<option value="${c.field}">${c.field}</option>`).join('');
            const tbody = document.getElementById('column-mapping-body');
            if (!tbody) return;
            const newRow = document.createElement('tr');
            newRow.setAttribute('draggable', 'true');
            newRow.innerHTML = `
                <td style="cursor: move;"><svg width="16" height="16" viewBox="0 0 24 24" fill="var(--gray-400)"><path d="M11 5h2v2h-2zm0 4h2v2h-2zm0 4h2v2h-2zm0 4h2v2h-2z"/></svg></td>
                <td><input class="form-input" placeholder="源字段"></td>
                <td><select class="form-select"><option value="">选择字段</option>${options}</select></td>
                <td><input class="form-input" placeholder="类型"></td>
                <td><input class="form-input" placeholder="默认值"></td>
                <td><button class="btn btn-danger btn-sm" onclick="deleteColumnRow(this)">删除</button></td>
            `;
            tbody.insertBefore(newRow, tbody.firstChild);
        }

        function saveColumnMappings() {
            const tbody = document.getElementById('column-mapping-body');
            if (!tbody) return;
            const rows = tbody.querySelectorAll('tr');
            const mappings = [];
            rows.forEach(r => {
                const cells = r.querySelectorAll('td');
                const src = cells[1]?.querySelector('input')?.value || '';
                const tgt = cells[2]?.querySelector('select')?.value || '';
                const type = cells[3]?.querySelector('input')?.value || '';
                const def = cells[4]?.querySelector('input')?.value || '';
                if (src && tgt) {
                    mappings.push({ source_field: src, target_field: tgt, type, default_value: def });
                }
            });
            savedMappingsData = mappings;
            columnMappingsSaved = true;
            alert('字段映射已保存！');
        }

        function deleteColumnRow(el) { el.closest('tr').remove(); }

        let draggedRow = null;
        function dragStart(e) { draggedRow = e.target.closest('tr'); e.target.style.opacity = '0.5'; }
        function dragOver(e) { e.preventDefault(); }
        function drop(e) {
            e.preventDefault();
            const targetRow = e.target.closest('tr');
            if (draggedRow && targetRow && draggedRow !== targetRow) {
                const tbody = document.getElementById('column-mapping-body');
                const rows = Array.from(tbody.querySelectorAll('tr'));
                const draggedIdx = rows.indexOf(draggedRow);
                const targetIdx = rows.indexOf(targetRow);
                if (draggedIdx < targetIdx) tbody.insertBefore(draggedRow, targetRow.nextSibling);
                else tbody.insertBefore(draggedRow, targetRow);
            }
            draggedRow.style.opacity = '1';
            draggedRow = null;
        }

        // ==================== 同步选项 ====================
        function toggleDeleteCondition() {
            const container = document.getElementById('delete-condition-container');
            if (container) container.style.display = document.getElementById('delete-before-insert').checked ? 'block' : 'none';
        }

        function togglePartitionOptions() {
            const container = document.getElementById('partition-options-container');
            if (container) container.style.display = document.getElementById('add-partition').checked ? 'block' : 'none';
        }

        function toggleVmonthOptions() {
            const container = document.getElementById('vmonth-options-container');
            if (container) container.style.display = document.getElementById('enable-vmonth').checked ? 'block' : 'none';
        }

        function saveSqlCondition() {
            const condition = document.getElementById('sql-where')?.value.trim();
            if (!condition) { alert('请输入SQL条件'); return; }
            let history = JSON.parse(localStorage.getItem('sql_conditions') || '[]');
            if (!history.includes(condition)) {
                history.unshift(condition);
                if (history.length > 5) history.pop();
                localStorage.setItem('sql_conditions', JSON.stringify(history));
            }
            renderSqlHistory();
            alert('条件已保存！');
        }

        function renderSqlHistory() {
            const history = JSON.parse(localStorage.getItem('sql_conditions') || '[]');
            const container = document.getElementById('sql-history');
            if (container) {
                container.innerHTML = history.map(cond => 
                    `<button class="btn btn-secondary btn-sm" onclick="applySqlCondition('${cond.replace(/'/g, "\\'")}')">${cond.substring(0, 20)}...</button>`
                ).join(' ');
            }
        }

        function applySqlCondition(cond) {
            const el = document.getElementById('sql-where');
            if (el) el.value = cond;
        }

        // ==================== 数据同步 ====================
        function startSync() {
            if (!sourceConnected || !targetConnected) { alert('请先连接数据库'); return; }
            
            const sourceTable = document.getElementById('source-table')?.value;
            const targetTable = document.getElementById('target-table')?.value;
            if (!sourceTable || !targetTable) { alert('请选择源表和目标表'); return; }
            
            const columnMappings = savedMappingsData;
            if (columnMappings.length === 0) { alert('请添加字段映射'); return; }

            const data = {
                source: getSourceConfig(),
                target: getTargetConfig(),
                tableMappings: [{ source_table: sourceTable, target_table: targetTable, column_mappings: columnMappings }],
                options: {
                    batch_size: parseInt(document.getElementById('batch-size')?.value || '1000'),
                    time_format: document.getElementById('time-format')?.value || '%Y-%m-%d %H:%M:%S',
                    delete_before_insert: document.getElementById('delete-before-insert')?.checked || false,
                    delete_condition: document.getElementById('delete-field')?.value && document.getElementById('delete-value')?.value ? 
                        `${document.getElementById('delete-field').value} = '${document.getElementById('delete-value').value}'` : null,
                    sql_where: document.getElementById('sql-where')?.value.trim() || null,
                    add_partition: document.getElementById('add-partition')?.checked || false,
                    partition_date: document.getElementById('partition-date')?.value || null,
                    partition_name: document.getElementById('partition-name')?.value || null,
                    partition_field: document.getElementById('partition-field')?.value || null,
                    enable_vmonth: document.getElementById('enable-vmonth')?.checked || false,
                    source_time_field: document.getElementById('source-time-field')?.value || null,
                    target_month_field: document.getElementById('target-month-field')?.value || 'v_month',
                    target_month_value: document.getElementById('target-month-value')?.value || null
                }
            };

            document.getElementById('modal-sync-log').textContent = '';
            document.getElementById('modal-progress-fill').style.width = '0%';
            document.getElementById('btn-cancel-sync').style.display = 'block';
            document.getElementById('btn-close-modal').style.display = 'none';
            document.getElementById('sync-modal').style.display = 'flex';

            fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
            .then(r => r.json()).then(d => {
                if (d.success) {
                    syncInterval = setInterval(checkSyncStatus, 1000);
                } else {
                    alert(d.message || '同步启动失败');
                    closeSyncModal();
                }
            });
        }

        function checkSyncStatus() {
            fetch('/api/sync_status').then(r => r.json()).then(d => {
                const progressFill = document.getElementById('progress-fill');
                const progressText = document.getElementById('progress-text');
                const insertedCount = document.getElementById('inserted-count');
                const syncLog = document.getElementById('sync-log');
                
                if (progressFill) progressFill.style.width = d.progress + '%';
                if (progressText) progressText.textContent = d.progress + '%';
                if (insertedCount) insertedCount.textContent = '已插入 ' + d.total_inserted + ' 条';
                
                const modalProgressFill = document.getElementById('modal-progress-fill');
                const modalProgressText = document.getElementById('modal-progress-text');
                const modalInsertedCount = document.getElementById('modal-inserted-count');
                const modalSyncLog = document.getElementById('modal-sync-log');
                
                if (modalProgressFill) modalProgressFill.style.width = d.progress + '%';
                if (modalProgressText) modalProgressText.textContent = d.progress + '%';
                if (modalInsertedCount) modalInsertedCount.textContent = '已插入 ' + d.total_inserted + ' 条';
                
                if (d.logs && d.logs.length > 0) {
                    if (syncLog) { syncLog.textContent = d.logs.join('\n'); syncLog.scrollTop = syncLog.scrollHeight; }
                    if (modalSyncLog) { modalSyncLog.textContent = d.logs.join('\n'); modalSyncLog.scrollTop = modalSyncLog.scrollHeight; }
                }
                
                if (!d.running) {
                    clearInterval(syncInterval);
                    document.getElementById('btn-cancel-sync').style.display = 'none';
                    document.getElementById('btn-close-modal').style.display = 'block';
                    
                    // 保存迁移历史记录
                    const status = d.progress >= 100 ? 'success' : 'failed';
                    saveSyncHistory(status, d.total_inserted);
                }
            });
        }

        function cancelSync() {
            fetch('/api/sync_cancel', { method: 'POST' }).then(r => r.json()).then(d => {
                if (d.success) {
                    clearInterval(syncInterval);
                    closeSyncModal();
                }
            });
        }

        function closeSyncModal() {
            document.getElementById('sync-modal').style.display = 'none';
        }

        // ==================== 配置保存/加载 ====================
        function saveDbConfig(type) {
            const name = prompt("请输入数据库配置名称：");
            if (!name) return;
            
            let config = type === 'source' ? getSourceConfig() : getTargetConfig();
            
            const configs = JSON.parse(localStorage.getItem('db_configs_list') || '{}');
            configs[name] = config;
            localStorage.setItem('db_configs_list', JSON.stringify(configs));
            alert(`数据库配置 "${name}" 已保存！`);
        }

        function showConfigModal() {
            renderConfigLists();
            document.getElementById('config-modal').style.display = 'flex';
        }

        function closeConfigModal() {
            document.getElementById('config-modal').style.display = 'none';
        }

        function renderConfigLists() {
            const configs = JSON.parse(localStorage.getItem('db_configs_list') || '{}');
            const container = document.getElementById('config-list-container');
            const names = Object.keys(configs);
            
            if (names.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--gray-400); padding: 40px;">暂无保存的配置</div>';
                return;
            }
            
            container.innerHTML = names.map(name => {
                const config = configs[name];
                const dbType = config.db_type || 'mysql';
                return `
                    <div class="db-config-card mb-4" style="cursor: pointer; position: relative;" onclick="applyConfig('${name}')">
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteConfig('${name}')" title="删除配置">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2">
                                <path d="M18 6L6 18M6 6l12 12"/>
                            </svg>
                        </button>
                        <div class="db-card-header" style="border-top: 3px solid ${dbColors[dbType]};">
                            <div class="db-icon-wrapper">
                                <img src="${dbIconPaths[dbType]}" alt="${dbTypeNames[dbType]}">
                            </div>
                            <div class="db-card-info">
                                <div class="db-card-title">${name}</div>
                                <div class="db-card-status">${dbTypeNames[dbType]} - ${config.host}:${config.port}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function deleteConfig(name) {
            if (!confirm(`确定要删除配置 "${name}" 吗？`)) return;
            
            const configs = JSON.parse(localStorage.getItem('db_configs_list') || '{}');
            delete configs[name];
            localStorage.setItem('db_configs_list', JSON.stringify(configs));
            renderConfigLists();
        }

        function applyConfig(name) {
            const configs = JSON.parse(localStorage.getItem('db_configs_list') || '{}');
            const config = configs[name];
            if (!config) return;
            
            // 应用到源数据库
            selectComponent('source-db');
            setTimeout(() => {
                if (document.getElementById('source-db-type')) document.getElementById('source-db-type').value = config.db_type || 'mysql';
                if (document.getElementById('source-host')) document.getElementById('source-host').value = config.host || '';
                if (document.getElementById('source-port')) document.getElementById('source-port').value = config.port || '';
                if (document.getElementById('source-user')) document.getElementById('source-user').value = config.user || '';
                if (document.getElementById('source-password')) document.getElementById('source-password').value = config.password || '';
                updateConfigPanel();
            }, 100);
            
            closeConfigModal();
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            updateConfigPanel();
            renderSqlHistory();
        });
    </script>
</body>
</html>
